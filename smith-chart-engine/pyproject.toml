[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smith-chart-engine"
version = "1.0.0"
description = "Reusable Smith chart renderer for RF teaching and automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Liu Zongchen"}]
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]
keywords = ["smith-chart", "rf", "microwave", "impedance", "admittance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
